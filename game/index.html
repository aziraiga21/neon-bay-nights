<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#163b43"><meta name="description" content="An original open-world coastal crime game. Walk, drive, and make your own trouble in Neon Bay.">
<link rel="icon" href="data:,">
<title>Neon Bay Nights</title>
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;color:#f6f1e7;background:#18333b}*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh;outline:none;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;z-index:1}button{font:inherit;cursor:pointer}#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#132c37f5 0%,#18323cda 42%,#1c19323d 100%);z-index:2}#screen.hidden{display:none}.panel{width:min(1120px,92vw);max-height:96vh;overflow:auto;padding:34px 24px}.eyebrow{font-size:11px;letter-spacing:4px;font-weight:bold;color:#8dddd6;margin:0 0 20px}.logo{font-size:clamp(58px,8vw,102px);font-weight:900;line-height:.84;letter-spacing:-5px;margin:0;text-shadow:4px 5px #14343b}.logo span{color:#ffac83;font-style:italic}.tagline{font-size:12px;font-weight:bold;letter-spacing:5px;color:#f6e7c1;margin:24px 0}.story{max-width:400px;color:#cad8d4;font-size:15px;line-height:1.7;margin:22px 0}.story strong{color:#f6f1e7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 24px}.actions button{border:1px solid #93b1ac66;border-radius:5px;background:#23414be6;color:#f6f1e7;font-size:13px;font-weight:bold;letter-spacing:1px;padding:16px 28px;transition:.15s}.actions button.primary{background:#f0b429;color:#29383b;border-color:#f0b429;box-shadow:0 3px #ab6c36}.actions button:hover,.actions button:focus-visible{transform:translateY(-2px);background:#3c626a;outline:2px solid #8dddd6;outline-offset:4px}.actions button.primary:hover{background:#ffd17c}.actions button:disabled{opacity:.35;cursor:default;transform:none}.controls{display:grid;grid-template-columns:repeat(2,minmax(140px,220px));gap:10px 16px;font-size:11px;color:#b7ccc9;line-height:1.6}.controls kbd{display:inline-block;min-width:22px;padding:1px 5px;margin-right:5px;border:1px solid #9bbab459;border-bottom-width:2px;border-radius:3px;color:#f6f1e7;font:10px Arial}.footer{font-size:10px;color:#89a5a5;margin-top:24px;letter-spacing:1px}.compact{width:min(540px,90vw);padding:36px;border:1px solid #73928d55;border-radius:12px;background:#17303beb;box-shadow:0 24px 100px #18252d99}.compact h1{font-size:48px;letter-spacing:-2px;margin:6px 0}.compact .story{max-width:100%}.compact .actions{margin-bottom:8px}.red{color:#ff8e91}.mini{font-size:12px;color:#a8c4be;line-height:1.8}.touch-note{display:none}@media(max-width:600px){.panel{padding:20px}.logo{letter-spacing:-3px}.story{font-size:13px;line-height:1.5}.tagline{letter-spacing:3px}.controls{gap:6px;font-size:10px}.actions{margin:20px 0}.footer{margin-top:16px}.touch-note{display:block;color:#f0b429;font-size:11px}}
.jobs{width:min(700px,94vw)}.jobs h1{font-size:40px}.job-list{display:grid;gap:8px;margin:20px 0}.job-list button{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:16px;border:1px solid #6c989466;border-radius:6px;color:#f6f1e7;background:#25474d}.job-list button:hover:not(:disabled),.job-list button:focus-visible{outline:2px solid #f0b429;background:#31565a}.job-list button:disabled{opacity:.4;cursor:default}.job-number{font-size:22px;color:#8dddd6}.job-list strong{display:block;font-size:15px}.job-list small{display:block;font-size:10px;line-height:1.6;color:#b7ccc9;margin-top:4px}.job-reward{margin-left:auto;white-space:nowrap;text-align:right;color:#f0b429;font-weight:bold}.gold{color:#f0b429}.ending h1{line-height:.95}
#screen{background:linear-gradient(90deg,#161a31f5,#1e263ad1 39%,#33253930 75%,transparent)}
.actions button.primary:focus-visible{background:#ffd17c;color:#242c37}
.compact{max-height:94vh;overflow:auto}
.logo span{color:#ffac97;text-shadow:2px 3px #6e486b}
@media(prefers-reduced-motion:reduce){.actions button{transition:none}}
/* Sunset matchbook lettering and the ruled edge of a dispatch slip. */
:root{font-family:"Liberation Mono","Courier New",monospace}
#screen{background:#231d3045}
.panel,.compact{color:#fff2d7;background:#242035f5;border:0;border-top:4px double #efa586;border-radius:0;box-shadow:none;clip-path:polygon(0 0,calc(100% - 25px) 0,100% 25px,100% 100%,17px 100%,0 calc(100% - 17px))}
.panel{width:min(580px,94vw);margin-right:auto;margin-left:5vw;padding:clamp(18px,3vh,36px) clamp(20px,4vw,56px)}
.logo,.compact h1{font-family:Georgia,"Liberation Serif",serif;font-weight:bold;font-style:italic}
.logo{font-size:clamp(54px,8vw,96px);color:#f9ddc0;text-shadow:2px 2px #242035,3px 3px #e48e80}
.logo span,.gold{color:#ffaa89}
.eyebrow{border-bottom:1px solid #ae827d;padding-bottom:10px;letter-spacing:2px;color:#acd7c9}
.tagline{letter-spacing:2px;color:#ffba94}.story{font-family:Georgia,serif;font-size:17px;line-height:1.45}
.actions button,.job-list button{border-radius:0;background:#383144;border:0;border-left:3px solid #8fcfc2;clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
.actions button.primary{color:#261d32;background:#ffac88;box-shadow:none}.actions button:focus-visible,.job-list button:focus-visible{background:#69546a}
.job-list button{border-bottom:1px dashed #94727b}.job-number{font:italic bold 28px Georgia,serif;color:#ffa888}
.controls kbd{font-family:inherit;border-radius:0}.compact{max-height:94vh;overflow:auto}.ending{border-top-color:#ffbe75}
.panel{position:relative}.logo{position:relative;isolation:isolate}.logo::before{content:"";position:absolute;z-index:-1;left:2.15em;bottom:.02em;width:1.28em;height:1.28em;border-radius:50%;background:repeating-linear-gradient(0deg,transparent 0 3px,#b86560 3px 9px);opacity:.65}
.garage{background:#efd8b5;color:#342b39;border-top:6px double #96543e}.garage h1{color:#342b39}.garage .eyebrow,.garage .mini{color:#634639}.garage .job-list{gap:0}.garage .job-list button{background:transparent;color:#342b39;border:0;border-bottom:1px dashed #916a58;clip-path:none}.garage .job-list small{color:#564745}.garage .job-number,.garage .job-reward{color:#813d32}.garage .job-list button:hover:not(:disabled),.garage .job-list button:focus-visible{background:#ffeac9}.pause h1{border-left:6px double #f7b391;padding-left:12px}.ending h1{font-size:clamp(48px,8vw,84px);text-shadow:2px 2px #542f48}
</style>
</head><body>
<canvas id="game" tabindex="0" aria-label="Neon Bay Nights game. WASD moves, Ctrl walks, Shift sprints and Space jumps. Hold the right mouse button to aim and left-click to attack. E enters a car. Escape pauses."></canvas>
